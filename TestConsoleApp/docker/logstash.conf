# logstash/pipeline/logstash.conf
input {
  http {
    port => 8080
    codec => json
  }
  
  beats {
    port => 5044
  }
}

filter {
  if [Timestamp] {
    date {
      match => [ "Timestamp", "yyyy-MM-dd'T'HH:mm:ss.SSSSSSS'Z'", "yyyy-MM-dd HH:mm:ss.SSSSSS", "ISO8601" ]
      target => "@timestamp"
    }
  }
  
  if [Level] {
    mutate {
      lowercase => [ "Level" ]
      rename => { "Level" => "level" }
    }
  }
  
  if [Message] {
    mutate {
      rename => { "Message" => "message" }
    }
  }
}

output {
  elasticsearch {
    hosts => ["elasticsearch:9200"]
    index => "app-logs-%{+YYYY.MM.dd}"
  }
  
  stdout { 
    codec => rubydebug 
  }
}