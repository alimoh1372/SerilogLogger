input {
  http {
    port => 8080
    host => "0.0.0.0"
    codec => "plain"  # ???: plain ???? json
  }
}

filter {
  # Parse manual JSON with array handling
  json {
    source => "message"
    target => "parsed_data"
    skip_on_invalid_json => true
  }
  
  # Handle array case
  if [parsed_data] {
    # Check if it's an array
    ruby {
      code => '
        data = event.get("parsed_data")
        
        if data.is_a?(Array) && data.length > 0
          # Take first element from array
          first_item = data[0]
          if first_item.is_a?(Hash)
            first_item.each do |key, value|
              # Safe field setting - avoid conflicts
              safe_key = key.gsub(/[^a-zA-Z0-9_]/, "_")
              event.set(safe_key, value)
            end
          end
        elsif data.is_a?(Hash)
          # Single object
          data.each do |key, value|
            safe_key = key.gsub(/[^a-zA-Z0-9_]/, "_")
            event.set(safe_key, value)
          end
        end
        
        # Remove parsed_data
        event.remove("parsed_data")
      '
    }
  }
  
  # Field mappings with safe names
  if [MessageTemplate] {
    mutate {
      add_field => { "log_message" => "%{MessageTemplate}" }
    }
  }
  
  if [Level] {
    mutate {
      add_field => { "log_level" => "%{Level}" }
    }
  }
  
  # Convert numeric fields safely
  if [ProcessId] {
    mutate { 
      convert => { "ProcessId" => "integer" }
      add_field => { "process_id" => "%{ProcessId}" }
    }
  }
  
  if [ThreadId] {
    mutate { 
      convert => { "ThreadId" => "integer" }
      add_field => { "thread_id" => "%{ThreadId}" }
    }
  }
  
  if [MessageId] {
    mutate { 
      convert => { "MessageId" => "integer" }
      add_field => { "message_id" => "%{MessageId}" }
    }
  }
  
  # Timestamp handling
  if [Timestamp] {
    date {
      match => [ "Timestamp", "ISO8601" ]
      target => "@timestamp"
    }
  }
  
  # Add metadata
  mutate {
    add_field => { 
      "received_at" => "%{@timestamp}"
      "processed_by" => "logstash"
    }
  }
  
  # Clean up original fields and potential conflicts
  mutate {
    remove_field => [ 
      "message", 
      "headers", 
      "host",
      "MessageTemplate",
      "Level",
      "Timestamp"
    ]
  }
}

output {
  elasticsearch {
    hosts => ["http://localhost:9200"]
    index => "serilog-logs-%{+YYYY.MM.dd}"
  }
  stdout {
    codec => rubydebug { metadata => false }
  }
}